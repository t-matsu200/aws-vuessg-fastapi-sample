# AWS CodeBuild build specification
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "Install phase started..."
      # Install uv, the package manager used in this project
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      # Add uv to the PATH as recommended by the installer
      - . /root/.local/bin/env
      # Install main and development dependencies from pyproject.toml
      - uv pip install --system -e .[dev]

  build:
    commands:
      - echo "Build phase started on `date`"
      # Run tests using pytest
      - echo "Running tests..."
      - pytest

  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  base-directory: 'pythonapp'
